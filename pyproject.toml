[project]
name = "isc-knowledge-base"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "markdown-it-py>=4.3.0",
    "numpy",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
]
