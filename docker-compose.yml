services:
  db:
    # Postgres + pgvector + pg_search (real BM25) in one image.
    # TODO: pin a concrete version tag once the schema is verified against it.
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: isc
      POSTGRES_PASSWORD: isc
      POSTGRES_DB: isc_kb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isc -d isc_kb"]
      interval: 5s
      retries: 10

  # On macOS run Ollama natively instead (Docker has no access to the Apple GPU):
  #   brew install ollama && ollama serve && ollama pull bge-m3
  # On a Linux server with a GPU: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
